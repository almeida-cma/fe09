<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Biblioteca Web & Modelos em Grid (52 Componentes 100% Fluidos)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-body: #070c18;
            --bg-nav: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #818cf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #34d399;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .busca-rapida {
            background: #070c18;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            padding: 6px 14px;
            font-size: 0.82rem;
            outline: none;
            width: 230px;
            transition: 0.2s;
        }
        .busca-rapida:focus { border-color: var(--primary); }

        .viewport-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #070c18;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .btn-vp {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-vp:hover { color: #fff; background: var(--bg-card); }
        .btn-vp.ativo { background: var(--primary); color: #070c18; font-weight: 800; }

        /* ABAS DE CATEGORIAS E COMPONENTES */
        .categorias-bar-wrap {
            background: #0d1527;
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
        }
        .categorias-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .categorias-bar::-webkit-scrollbar { height: 4px; }
        .categorias-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .cat-btn {
            background: var(--bg-nav);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-btn:hover { color: #fff; border-color: var(--primary); }
        .cat-btn.ativo { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #070c18; font-weight: 800; border-color: transparent; }

        .componentes-bar-wrap {
            background: #070c18;
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
        }
        .componentes-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .componentes-bar::-webkit-scrollbar { height: 4px; }
        .componentes-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .comp-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
        }
        .comp-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .comp-btn.ativo { background: rgba(56, 189, 248, 0.15); color: var(--primary); border-color: rgba(56, 189, 248, 0.4); font-weight: 700; }

        /* ÁREA DE VISUALIZAÇÃO */
        .workspace {
            flex: 1;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .comp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .comp-header h1 { font-size: 1.5rem; color: #fff; }

        .meta-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge.resp { background: rgba(52, 211, 153, 0.15); color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

        .info-box {
            background: var(--bg-nav);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 18px;
            font-size: 0.86rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .info-box code { background: #070c18; color: #fbbf24; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

        .preview-box {
            background: #040711;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 22px;
        }
        .preview-topbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-dots { display: flex; gap: 6px; }
        .p-dot { width: 10px; height: 10px; border-radius: 50%; }
        .p-dot.r { background: #ef4444; }
        .p-dot.y { background: #f59e0b; }
        .p-dot.g { background: #10b981; }

        .preview-meta { font-family: monospace; font-size: 0.75rem; color: var(--text-muted); }

        .stage {
            display: flex;
            justify-content: center;
            background: #020617;
            padding: 16px;
            min-height: 520px;
        }

        .preview-iframe {
            width: 100%;
            height: 560px;
            border: none;
            background: white;
            border-radius: 8px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        /* ABAS DE CÓDIGO */
        .code-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); }
        .c-tab {
            padding: 9px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.15s;
        }
        .c-tab:hover { color: #fff; background: var(--bg-nav); }
        .c-tab.ativa { color: var(--primary); border-bottom-color: var(--primary); }

        .code-panel {
            display: none;
            position: relative;
            background: #030712;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .code-panel.ativo { display: block; }

        .btn-copiar {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: #070c18;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
        }
        .btn-copiar:hover { background: #7dd3fc; }

        pre {
            padding: 16px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            overflow-x: auto;
            max-height: 420px;
        }

        @media (max-width: 680px) {
            .top-bar { flex-direction: column; align-items: stretch; }
            .viewport-controls { justify-content: space-around; }
            .stage { padding: 4px; }
            .preview-iframe { border-radius: 4px; height: 460px; }
            .busca-rapida { width: 100%; }
        }
    </style>
</head>

    ];

    /* ============================================================
       CONTROLE E ESTADO DA APLICAÇÃO
       ============================================================ */
    const categorias = [...new Set(BANCO.map(item => item.categoria))];
    let categoriaAtual = categorias[0];
    let componenteAtualId = BANCO[0].id;
    let resolucaoAtual = '100%';

    const listaCategorias = document.getElementById('listaCategorias');
    const listaComponentes = document.getElementById('listaComponentes');
    const conteudoComponente = document.getElementById('conteudoComponente');

    function renderizarCategorias() {
        listaCategorias.innerHTML = '';
        categorias.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn' + (cat === categoriaAtual ? ' ativo' : '');
            btn.textContent = cat;
            btn.onclick = () => {
                categoriaAtual = cat;
                const primeiro = BANCO.find(c => c.categoria === cat);
                if (primeiro) componenteAtualId = primeiro.id;
                renderizarCategorias();
                renderizarComponentes();
                carregarComponente();
            };
            listaCategorias.appendChild(btn);
        });
    }

    function renderizarComponentes() {
        listaComponentes.innerHTML = '';
        const componentes = BANCO.filter(c => c.categoria === categoriaAtual);
        componentes.forEach(comp => {
            const btn = document.createElement('button');
            btn.className = 'comp-btn' + (comp.id === componenteAtualId ? ' ativo' : '');
            btn.innerHTML = `${comp.icone} ${comp.nome}`;
            btn.onclick = () => {
                componenteAtualId = comp.id;
                renderizarComponentes();
                carregarComponente();
            };
            listaComponentes.appendChild(btn);
        });
    }

    function carregarComponente() {
        const comp = BANCO.find(c => c.id === componenteAtualId);
        if (!comp) return;

        const htmlCompleto = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    line-height: 1.5;
    overflow-x: hidden;
    max-width: 100vw;
}
img, svg, video, iframe { max-width: 100%; height: auto; }
input, button, textarea, select { font-family: inherit; }
${comp.css}
</style>
</head>
<body>
${comp.html}
<script>
${comp.js}
<\/script>
</body>
</html>`;

        conteudoComponente.innerHTML = `
            <div class="comp-header">
                <h1>${comp.icone} ${comp.nome}</h1>
                <div class="meta-badges">
                    <span class="badge resp">✅ 100% Fluido (320px+)</span>
                    <span class="badge">${comp.categoria}</span>
                </div>
            </div>

            <div class="info-box">
                💡 <strong>Dica de Uso:</strong> ${comp.dicas}
            </div>

            <div class="preview-box">
                <div class="preview-topbar">
                    <div class="preview-dots"><span class="p-dot r"></span><span class="p-dot y"></span><span class="p-dot g"></span></div>
                    <span class="preview-meta">preview-${comp.id}.html • Largura: ${resolucaoAtual}</span>
                    <div style="width:24px;"></div>
                </div>
                <div class="stage">
                    <iframe class="preview-iframe" id="frameView" style="width: ${resolucaoAtual};"></iframe>
                </div>
            </div>

            <div class="code-tabs">
                <button class="c-tab ativa" onclick="mudarAba(this, 'html')">📄 HTML</button>
                <button class="c-tab" onclick="mudarAba(this, 'css')">🎨 CSS</button>
                <button class="c-tab" onclick="mudarAba(this, 'js')">⚙️ JS</button>
                <button class="c-tab" onclick="mudarAba(this, 'tudo')">📦 Código Completo</button>
            </div>

            <div class="code-panel ativo" id="p-html"><button class="btn-copiar" onclick="copiar('p-html', this)">Copiar HTML</button><pre>${escapar(comp.html)}</pre></div>
            <div class="code-panel" id="p-css"><button class="btn-copiar" onclick="copiar('p-css', this)">Copiar CSS</button><pre>${escapar(comp.css)}</pre></div>
            <div class="code-panel" id="p-js"><button class="btn-copiar" onclick="copiar('p-js', this)">Copiar JS</button><pre>${escapar(comp.js)}</pre></div>
            <div class="code-panel" id="p-tudo"><button class="btn-copiar" onclick="copiar('p-tudo', this)">Copiar Tudo</button><pre>${escapar(htmlCompleto)}</pre></div>
        `;

        document.getElementById('frameView').srcdoc = htmlCompleto;
    }

    function ajustarResolucao(largura, btn) {
        document.querySelectorAll('.btn-vp').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        resolucaoAtual = largura;
        const frame = document.getElementById('frameView');
        if (frame) {
            frame.style.width = largura;
            const meta = document.querySelector('.preview-meta');
            if (meta) meta.textContent = `preview-${componenteAtualId}.html • Largura: ${largura}`;
        }
    }

    function mudarAba(btn, aba) {
        document.querySelectorAll('.c-tab').forEach(b => b.classList.remove('ativa'));
        document.querySelectorAll('.code-panel').forEach(p => p.classList.remove('ativo'));
        btn.classList.add('ativa');
        document.getElementById('p-' + aba).classList.add('ativo');
    }

    function copiar(idPainel, btn) {
        const texto = document.getElementById(idPainel).querySelector('pre').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            const orig = btn.textContent;
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = orig, 1600);
        });
    }

    function filtrarPorBusca() {
        const termo = document.getElementById('campoBusca').value.toLowerCase().trim();
        if (!termo) return;
        const encontrado = BANCO.find(c => c.nome.toLowerCase().includes(termo) || c.id.toLowerCase().includes(termo));
        if (encontrado) {
            categoriaAtual = encontrado.categoria;
            componenteAtualId = encontrado.id;
            renderizarCategorias();
            renderizarComponentes();
            carregarComponente();
        }
    }

    function escapar(txt) {
        return txt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Inicialização direta
    renderizarCategorias();
    renderizarComponentes();
    carregarComponente();
</script>
</body>
</html>
